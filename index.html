<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Bar ordering system — browse the menu, add drinks to your basket, and place your order directly from the table." />
  <title>Qstop — Order & Pay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ═══════════════════════════════════════════════
       LOGIN SCREEN
  ═══════════════════════════════════════════════ -->
  <div id="login-screen" class="screen active">

    <!-- Left: Brand Hero -->
    <div class="login-brand-half" aria-hidden="true">
      <p class="login-brand-tagline">Roskilde Festival</p>
      <h1 class="login-brand-name">Qstop</h1>
      <p class="login-brand-sub">Craft cocktails &amp; fine spirits</p>
    </div>

    <!-- Right: Sign-in Form -->
    <div class="login-form-half">
      <span class="login-form-icon">🍸</span>
      <h2 class="login-form-title">Welcome back</h2>
      <p class="login-form-sub">Sign in to browse the menu &amp; order</p>

      <button id="btn-google-signin" class="btn-google">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Continue with Google
      </button>

      <p id="login-error" class="login-error"></p>

      <p class="login-terms">By signing in you agree to our terms of service</p>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════
       MENU SCREEN
  ═══════════════════════════════════════════════ -->
  <div id="menu-screen" class="screen">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="top-logo">🍸 Qstop</span>
      </div>
      <div class="top-bar-center">
        <div class="category-tabs" id="category-tabs" role="tablist"></div>
      </div>
      <div class="top-bar-right">
        <div class="user-chip">
          <img id="user-avatar" class="user-avatar" src="" alt="User avatar" />
          <span id="user-name" class="user-name-label"></span>
        </div>
        <button id="btn-logout" class="btn-logout" aria-label="Sign out">Sign out</button>
        <button id="btn-basket" class="btn-basket" aria-label="Open basket">
          <span class="basket-icon">🛒</span>
          <span id="basket-badge" class="basket-badge hidden">0</span>
          <span id="basket-total-label" class="basket-total-label">Basket</span>
        </button>
      </div>
    </header>

    <!-- Menu Grid -->
    <main class="menu-main">
      <div class="page-indicator" id="page-indicator"></div>
      <div id="menu-grid" class="menu-grid" aria-label="Menu items"></div>
      <div class="page-nav">
        <button id="btn-prev" class="btn-page" aria-label="Previous page" disabled>&#8592;</button>
        <button id="btn-next" class="btn-page" aria-label="Next page" disabled>&#8594;</button>
      </div>
    </main>

  </div>

  <!-- ═══════════════════════════════════════════════
       BASKET PANEL (slide-in overlay)
  ═══════════════════════════════════════════════ -->
  <div id="basket-panel" class="basket-panel" aria-modal="true" role="dialog" aria-label="Your basket">
    <div class="basket-backdrop" id="basket-backdrop"></div>
    <div class="basket-drawer">
      <div class="basket-header">
        <h2 class="basket-title">Your Order</h2>
        <button id="btn-close-basket" class="btn-close" aria-label="Close basket">✕</button>
      </div>
      <div id="basket-items" class="basket-items"></div>
      <div class="basket-footer">
        <div class="basket-total-row">
          <span>Total</span>
          <span id="basket-total-price" class="basket-total-price">kr. 0</span>
        </div>
        <button id="btn-place-order" class="btn-place-order">Place Order 🍸</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       ORDER CONFIRMED OVERLAY
  ═══════════════════════════════════════════════ -->
  <div id="order-confirmed" class="order-confirmed-overlay hidden">
    <div class="order-confirmed-card">
      <div class="order-anim">✅</div>
      <h2>Order Placed!</h2>
      <p>The bar has been notified. Your drinks are being prepared.</p>
      <button id="btn-order-done" class="btn-order-done">Back to Menu</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module" src="app.js"></script>
</body>

</html>
